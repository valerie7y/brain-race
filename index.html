<style>
:root{
  --ink:#24163F; --ink2:#5B4B78; --bg1:#FFF3D9; --bg2:#FFE3F1; --card:#fff;
  --pc:#2F80ED; --pcSoft:#E6F0FF; --good:#16A34A; --bad:#EF4444; --hint:#FFB020;
  --r:26px; --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Arial Rounded MT Bold", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --safeT: env(safe-area-inset-top, 0px); --safeB: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg1);overflow-x:hidden; -webkit-user-select:none; user-select:none;-webkit-font-smoothing:antialiased;}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(120% 60% at 0% 0%, #FFE7A8 0%, transparent 55%),
  radial-gradient(90% 50% at 100% 10%, #FFC9E4 0%, transparent 60%),
  radial-gradient(90% 60% at 50% 110%, #C9E6FF 0%, transparent 60%),
  linear-gradient(180deg,var(--bg1),var(--bg2));}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(var(--safeT) + 8px) 14px calc(var(--barH,190px) + 12px)}
.hint,.ans{scroll-margin-bottom:calc(var(--barH,190px) + 12px)}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 2px 8px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:22px;letter-spacing:-.3px}
.logo svg{width:32px;height:32px;border-radius:9px;box-shadow:0 3px 10px rgba(124,58,237,.35)}
.logo b{background:linear-gradient(90deg,#7C3AED,#FF4FA3 60%,#FF8A00);-webkit-background-clip:text;background-clip:text;color:transparent}
.iconbtn{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.75);box-shadow:0 2px 8px rgba(36,22,63,.08);font-size:21px;display:grid;place-items:center}
.iconbtn:active{transform:scale(.94)}
.topbtns{display:flex;gap:8px}
/* scoreboard */
.board{position:sticky;top:calc(var(--safeT));z-index:5;display:grid;gap:8px;padding:6px 0 10px;
  background:linear-gradient(180deg, rgba(255,243,217,.96) 70%, rgba(255,243,217,0));}
.pcard{position:relative;background:#fff;border-radius:20px;padding:8px 6px 8px;text-align:center;box-shadow:0 3px 12px rgba(36,22,63,.08);border:3px solid transparent;transition:transform .25s, box-shadow .25s}
.pcard.on{border-color:var(--c);transform:translateY(-2px);box-shadow:0 8px 22px color-mix(in srgb, var(--c) 35%, transparent)}
.pcard.on::after{content:"▼";position:absolute;left:50%;bottom:-15px;transform:translateX(-50%);color:var(--c);font-size:12px}
.pname{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;justify-content:center;gap:4px}
.pname .em{font-size:17px}
.pscore{font-weight:900;font-size:34px;line-height:1.05;color:var(--c);font-variant-numeric:tabular-nums}
.pscore.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.35)}100%{transform:scale(1)}}
.pbar{height:7px;border-radius:9px;background:#F1ECF8;overflow:hidden;margin:3px 4px 6px}
.pbar i{display:block;height:100%;background:var(--c);border-radius:9px;transition:width .5s}
.adj{display:flex;justify-content:center;gap:6px}
.adj button{width:34px;height:28px;border-radius:10px;background:#F4F0FA;font-weight:900;font-size:18px;line-height:1;color:var(--ink2)}
.adj button:active{background:#E8E0F5}
.lvl{font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--ink2);opacity:.75;margin-top:1px}
.goal{grid-column:1/-1;text-align:center;font-size:12.5px;font-weight:800;color:var(--ink2);opacity:.8;margin-top:2px}
/* main card */
.card{position:relative;background:var(--card);border-radius:var(--r);padding:18px 18px 20px;box-shadow:0 10px 30px rgba(36,22,63,.12);border-top:10px solid var(--pc);margin-top:6px;overflow:hidden}
.card::before{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:var(--pcSoft);z-index:0}
.card>*{position:relative;z-index:1}
.turn{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-right:64px}
.avatar{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:32px;background:var(--pcSoft);box-shadow:inset 0 0 0 3px var(--pc)}
.turn h2{margin:0;font-size:28px;font-weight:900;letter-spacing:-.4px;line-height:1.05}
.turn h2 span{color:var(--pc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;padding:4px 10px;border-radius:99px;background:#F4F0FA;color:var(--ink2)}
.chip.lv{background:var(--pc);color:#fff}
.q{font-size:clamp(27px,8vw,38px);line-height:1.2;font-weight:800;margin:14px 0 6px;letter-spacing:-.2px;text-wrap:balance}
.q.long{font-size:clamp(23px,6.6vw,31px)}
.hints{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.hint{background:#FFF6E0;border:2px dashed #FFC64D;border-radius:16px;padding:10px 12px;font-size:20px;font-weight:700;animation:pop .35s}
.hint b{color:#B7791F;font-size:13px;text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:2px}
.ans{margin-top:12px;background:#EFFBF2;border:2px solid #86E0A3;border-radius:16px;padding:10px 12px;animation:pop .35s}
.ans b{color:#15803D;font-size:13px;text-transform:uppercase;letter-spacing:.6px;display:block}
.ans div{font-size:24px;font-weight:900}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
.card>.skip{position:absolute;z-index:3;right:12px;top:12px;font-size:13px;font-weight:800;background:#F4F0FA;color:var(--ink2);padding:7px 10px;border-radius:12px}
/* result */
.res-head{text-align:center;margin:4px 0 12px}
.res-emoji{font-size:64px;line-height:1;animation:pop .4s}
.res-title{font-size:30px;font-weight:900;margin-top:6px;letter-spacing:-.4px}
.res-sub{font-size:17px;font-weight:700;color:var(--ink2);margin-top:2px}
.res-q{font-size:17px;font-weight:700;color:var(--ink2);margin:6px 0 4px}
.bigans{background:#EFFBF2;border:3px solid #86E0A3;border-radius:20px;padding:12px 14px;margin:8px 0}
.bigans small{display:block;color:#15803D;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.6px}
.bigans div{font-size:28px;font-weight:900;line-height:1.15}
.fact{background:linear-gradient(135deg,#EEF2FF,#FDF2FF);border-radius:20px;padding:12px 14px;margin-top:10px;border:2px solid #DCD3FF}
.fact small{display:block;color:#6D28D9;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px}
.fact div{font-size:20px;font-weight:700;line-height:1.3}
/* action bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:16px 12px calc(var(--safeB) + 12px);background:linear-gradient(180deg,rgba(255,229,240,0),rgba(255,229,240,.97) 16px);}
.bar-in{max-width:560px;margin:0 auto;display:grid;gap:8px}
.row{display:grid;gap:8px}
.r3{grid-template-columns:1.1fr 1.4fr .6fr}
.r2{grid-template-columns:1fr 1fr}
.btn{white-space:nowrap;height:58px;border-radius:18px;font-size:19px;font-weight:900;background:#fff;box-shadow:0 4px 0 rgba(36,22,63,.12),0 6px 14px rgba(36,22,63,.08);display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(36,22,63,.12)}
.btn.big{height:70px;font-size:23px;border-radius:22px}
.btn.good{background:var(--good);color:#fff;box-shadow:0 5px 0 #0E7A35,0 8px 18px rgba(22,163,74,.35)}

.tog{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;font-weight:800;font-size:17px;border-bottom:1px solid #F1ECF8}
.tog input{width:24px;height:24px;accent-color:#7C3AED}
.wide{width:100%;height:52px;border-radius:16px;font-weight:900;font-size:17px;background:#F4F0FA;margin-top:8px}

.note{font-size:14px;color:var(--ink2);font-weight:600;line-height:1.35}
.x{width:40px;height:40px;border-radius:12px;background:#F4F0FA;font-size:20px}
/* winner */
.win{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 40%, rgba(124,58,237,.75), rgba(36,22,63,.88));animation:fade .3s}
.win[hidden]{display:none}
.winbox{position:relative;z-index:2;background:#fff;border-radius:32px;padding:24px 20px 20px;text-align:center;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .5s}
.trophy{font-size:84px;line-height:1;animation:wob 1.2s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-8deg) scale(1.08)}}
.winbox h2{font-size:38px;font-weight:900;margin:8px 0 2px;letter-spacing:-.6px}
.winbox p{margin:0 0 12px;font-weight:800;color:var(--ink2);font-size:17px}
.final{display:flex;flex-direction:column;gap:6px;margin:10px 0 14px}
.final div{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-radius:14px;background:#F8F5FD;font-weight:900;font-size:19px}
#confetti{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:41;pointer-events:none}
.toast{position:fixed;left:50%;top:calc(var(--safeT) + 14px);transform:translateX(-50%);background:#24163F;color:#fff;padding:10px 16px;border-radius:16px;font-weight:800;font-size:15px;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:pop .25s;max-width:90vw;text-align:center}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const QB = {"8":[["animals","What is the biggest animal in the whole world?","It lives in the ocean and it's a kind of whale.","It's named after the color of the sky: the B___ whale.","The blue whale","A blue whale can be longer than two school buses parked end to end."],["animals","How many legs does a spider have?","It's more than an insect has.","It's the same number as an octopus's arms, and it rhymes with \"gate.\"","8","Spiders are not insects; they're cousins of scorpions."],["animals","What is a baby kangaroo called?","It rides in its mom's pouch.","It starts with J and rhymes with \"Chloe.\"","A joey","A newborn joey is only about the size of a jellybean."],["animals","Which giant bird can't fly but runs super fast?","It's the biggest bird in the world and has a long neck.","It starts with \"Os-\" and rhymes with \"rich.\"","The ostrich","Ostriches can run about 45 miles per hour, as fast as a car on a city street."],["animals","Which furry animal can fly and sleeps hanging upside down?","It comes out at night.","It rhymes with \"cat,\" and you hit a ball with one in baseball.","The bat","Many bats find food in the dark by listening to the echoes of their own squeaks."],["animals","Which animal is called the \"King of the Jungle\"?","It has a big furry mane and ROARS!","It starts with L: L-I-O-N.","The lion","Lions actually live mostly in grasslands, not jungles."],["animals","Which black-and-white striped animal looks like a horse?","It lives in Africa.","It starts with Z.","The zebra","Every zebra's stripe pattern is different, like a fingerprint."],["animals","What does a caterpillar turn into?","It grows colorful wings.","It starts with B and has \"butter\" in its name!","A butterfly (or a moth)","Butterflies taste things with their feet."],["animals","What is the tallest animal in the world?","It has a super long neck and spots.","It starts with G: gi-RAFFE.","The giraffe","A giraffe's tongue can be about 20 inches long, and it's dark purple."],["animals","What sweet food do bees make?","It's golden and sticky.","Winnie the Pooh loves it! It starts with H.","Honey","Honey lasts so long that archaeologists have found honey thousands of years old in Egyptian tombs."],["animals","What is a baby dog called?","It's small, cute, and playful.","It starts with P and rhymes with \"guppy.\"","A puppy","Puppies are born with their eyes closed and open them at about two weeks old."],["animals","What is the biggest kind of cat in the world?","It's orange with black stripes.","It starts with T and rhymes with \"Tigger\"!","The tiger","No two tigers have exactly the same stripes."],["animals","Which super-slow animal hangs in rainforest trees?","It's famous for being slow, like Flash in \"Zootopia.\"","It rhymes with \"cloth\" and starts with S.","The sloth","Sloths climb down from their trees only about once a week to go to the bathroom."],["animals","What do giant pandas mostly eat?","It's a tall green plant.","It starts with B and rhymes with \"shampoo.\"","Bamboo","A giant panda can spend 10 to 16 hours a day eating."],["animals","How many legs does an insect, like an ant, have?","Fewer than a spider's 8.","It's 3 + 3.","6","An insect's body has three parts: head, middle, and back end."],["animals","What sound does a cow make?","It lives on a farm and gives milk.","It rhymes with \"zoo.\"","Moo","Cows can have best friends and feel calmer when they're together.",1],["animals","What sound does a duck make?","It swims in ponds.","It rhymes with \"back.\"","Quack","Ducks have waterproof feathers thanks to a special oil they spread with their beaks.",1],["animals","Which farm animal says \"oink\"?","It loves to roll in the mud.","It rhymes with \"big.\"","A pig","Pigs roll in mud to stay cool because they can't sweat much.",1],["animals","Which animal says \"baa\"?","Its fluffy wool is used to make sweaters.","It rhymes with \"jeep.\"","A sheep","A sheep's wool keeps growing, so most sheep get a \"haircut\" once a year.",1],["animals","Which animal says \"neigh\"?","You can ride on its back.","It rhymes with \"course.\"","A horse","Horses can sleep standing up.",1],["animals","Which bird says \"hoot\" at night?","It has big round eyes.","It rhymes with \"towel.\"","An owl","Owls can turn their heads about three-quarters of the way around.",1],["animals","What sound does a snake make?","It sounds like \"Ssssss.\"","It rhymes with \"kiss.\"","Hiss","Snakes smell things by flicking their tongues.",1],["animals","What sound does a dog make?","It's a happy pet that wags its tail.","It rhymes with \"roof\"... W___!","Woof (a bark)","Every dog's nose print is different, like a fingerprint.",1],["animals","What is a baby cat called?","It's small and fluffy and says \"mew.\"","It rhymes with \"mitten.\"","A kitten","Most kittens are born with blue eyes that can change color as they grow.",1],["animals","What is a baby cow called?","It rhymes with \"half.\"","It starts with C: C-A-L-F.","A calf","A calf can stand up about an hour after it's born.",1],["animals","What is a baby chicken called?","It's small, yellow, and fluffy.","It rhymes with \"stick.\"","A chick","A chick peeps to its mother while it's still inside the egg!",1],["animals","What is a baby duck called?","It's a \"duck\" with \"-ling\" at the end.","Duck...ling!","A duckling","Ducklings follow the first moving thing they see, which is usually their mom.",1],["animals","What is a baby frog called?","It swims and has a tail, no legs at first.","It starts with \"tad.\"","A tadpole","Tadpoles breathe underwater with gills, like fish.",1],["animals","What is a baby sheep called?","It rhymes with \"ham.\"","It starts with L: L-A-M-B.","A lamb","A lamb can pick out its mother's voice from the whole flock.",1],["animals","Which animal has a long trunk and big floppy ears?","It's the biggest animal on land.","It starts with E: El-e-...","An elephant","Elephants use their trunks to drink, smell, grab food, and even hug.",1],["animals","Which slow animal carries its shell house on its back and leaves a slimy trail?","It's slower than a turtle!","It rhymes with \"mail.\"","A snail","A snail's slime helps it glide along, even upside down."],["animals","This or that: which is bigger, a mouse or an elephant?","One is tiny, one is giant.","It's the one with a trunk.","An elephant","An African elephant can weigh as much as three or four cars.",1],["animals","Yes or no: can penguins fly in the air?","They're birds, but their wings are like flippers.","They \"fly\" underwater instead.","No","Penguins use their wings to zoom through the water.",1],["animals","Which black-and-white animal sprays a stinky smell when it's scared?","It has a fluffy tail with a white stripe.","It rhymes with \"dunk.\"","A skunk","A skunk stamps its feet as a warning before it sprays."],["animals","Where do bees live?","It's a busy home full of honey.","It rhymes with \"five.\"","In a hive","A single hive can have tens of thousands of bees."],["animals","What do spiders spin to catch bugs?","It's sticky and made of silk.","It rhymes with \"Deb.\"","A web","Spider silk is super strong for how thin it is.",1],["animals","This or that: which is faster, a cheetah or a turtle?","One is a spotted big cat.","It's not the one with a shell!","A cheetah","The cheetah is the fastest land animal in the world.",1],["animals","Which bird is a symbol of the United States?","It's a big bird with a white head.","It's the bald ... E-A-G-L-E.","The bald eagle","Bald eagles aren't really bald; their heads are covered in white feathers."],["animals","Which animal hops and carries its baby in a pouch?","It lives in Australia.","It starts with K and rhymes with \"shampoo.\"","A kangaroo","Kangaroos can't walk backward easily, but they're amazing jumpers.",1],["science","What do plants need from the sun to grow?","It's what makes the daytime bright.","It's \"sun\" + \"light.\"","Sunlight","Plants make their own food from sunlight, and they give off the air we breathe."],["science","What is frozen water called?","You put it in drinks to make them cold.","It rhymes with \"nice.\"","Ice","Ice floats because it's lighter than the same amount of liquid water.",1],["science","What pulls things down to the ground when you drop them?","It makes an apple fall from a tree.","It starts with G and rhymes with \"cavity.\"","Gravity","On the Moon, gravity is weaker, so you could jump about six times higher."],["science","What color do you get when you mix blue and yellow paint?","It's the color of grass.","It starts with G and rhymes with \"bean.\"","Green","Light mixes differently than paint: red light plus green light makes yellow!",1],["science","How many colors are in a rainbow?","Red, orange, yellow, green, blue, indigo, violet.","It's the same as the number of days in a week.","7","You can only see a rainbow when the Sun is behind you."],["science","What kinds of things stick to a magnet?","Paper clips and nails stick to it.","They're made of M-E-T-A-L (some kinds, like iron).","Some metal things, like iron and steel","Earth acts like a giant magnet, which is why a compass needle points north."],["science","What do we call water that falls from clouds in drops?","You need an umbrella for it.","It rhymes with \"train.\"","Rain","Falling raindrops are shaped more like hamburger buns than teardrops.",1],["science","What tool do scientists use to make tiny things look big?","It has lenses you look through.","It starts with \"micro\" and ends with \"scope.\"","A microscope","The first microscopes were invented more than 400 years ago."],["science","What makes the loud BOOM of thunder?","It always comes with a bright flash in a storm.","It's \"light\" + \"ning.\"","Lightning","A lightning bolt is about five times hotter than the surface of the Sun."],["science","Which is heavier: a pound of feathers or a pound of rocks?","It's a trick question! Listen to the words.","They are both one pound...","Neither! They weigh the same","Feathers just take up a lot more space, which is why they seem lighter."],["science","What falls from clouds as white, frozen flakes?","You can build a man out of it.","It rhymes with \"go.\"","Snow","Most snowflakes have six sides or six arms.",1],["science","What tool tells you how hot or cold it is?","The doctor uses one to check for a fever.","It starts with \"thermo\" and ends with \"meter.\"","A thermometer","Water freezes at 32 degrees Fahrenheit."],["science","What do you see in the sky when the sun shines right after rain?","It's colorful and shaped like an arch.","It's \"rain\" + \"bow.\"","A rainbow","A rainbow is really a full circle, but the ground usually hides the bottom half.",1],["science","What are clouds made of?","They float in the sky and bring rain.","Tiny drops of W___.","Tiny drops of water (and ice)","A big fluffy cloud can weigh as much as 100 elephants!"],["science","In which season do leaves fall off many trees?","It comes after summer.","It has the same name as what the leaves do: they F___.","Fall (autumn)","Leaves change color in fall because they stop making their green color.",1],["science","Which season is the hottest?","School is out and you go to the beach.","It rhymes with \"drummer.\"","Summer","The first day of summer is the longest day of the year.",1],["science","Which season comes right after winter?","Flowers start to bloom.","It's also something bouncy, like on a trampoline!","Spring","Many baby animals are born in spring when food is easier to find.",1],["science","What do you call little balls of ice that fall in a storm?","It's not snow and it's not rain.","It rhymes with \"mail.\"","Hail","Most hailstones are the size of peas, but some can be as big as baseballs."],["science","What do you call a cloud that's down low, touching the ground?","It makes it hard to see far.","It rhymes with \"dog.\"","Fog","San Francisco's famous fog even has a nickname: Karl!"],["science","This or that: which is colder, a snowball or a cup of hot cocoa?","One is made of snow.","It's the one you can throw in a snowball fight!","A snowball","The biggest snowball fight ever had more than 7,000 people!",1],["science","What gas makes balloons float up into the sky?","It's lighter than air.","It starts with H: Hel-...","Helium","Helium makes your voice sound squeaky because sound travels faster through it."],["space","What planet do we live on?","It's the third planet from the Sun.","It starts with E and rhymes with \"birth.\"","Earth","About 71% of Earth is covered by water.",1],["space","What is the closest star to Earth?","You can see it in the daytime.","It makes the day sunny: the S-U-N!","The Sun","Sunlight takes about 8 minutes to travel from the Sun to Earth.",1],["space","Which planet is called the Red Planet?","It's right next to Earth.","It starts with M and rhymes with \"stars.\"","Mars","Mars looks red because its dirt has rusty iron in it."],["space","What is the biggest planet in our solar system?","It's a giant gas planet with a big red spot.","It starts with J: Ju-pi-...","Jupiter","More than 1,300 Earths could fit inside Jupiter."],["space","Which planet has big, beautiful rings around it?","It's the sixth planet from the Sun.","It starts with S: Sat-urn.","Saturn","Saturn is so light for its size that it would float in a (giant!) bathtub."],["space","How many planets are in our solar system?","Pluto doesn't count anymore.","It's the same as a spider's legs.","8","Pluto is now called a \"dwarf planet.\""],["space","Who was the first person to walk on the Moon?","He was an American astronaut in 1969.","His first name is Neil, and his last name sounds like \"arm strong.\"","Neil Armstrong","His footprints are probably still there, because there's no wind on the Moon."],["space","What do we call a person who travels into space?","They wear a spacesuit and ride a rocket.","It starts with \"astro\" and ends with \"naut.\"","An astronaut","Astronauts float in space because they're falling around Earth."],["space","What is the name of our galaxy?","It sounds like a candy bar.","The Milky ___ (it rhymes with \"day\").","The Milky Way","Our galaxy has more than 100 billion stars."],["space","What shape is the Earth?","Think of a ball.","It's round like a B-A-L-L.","Round, like a ball (a sphere)","Earth is a little wider around the middle than from top to bottom.",1],["space","How many hours are in one day?","It's how long Earth takes to spin around once.","It's 2 dozen: 12 + 12.","24","At the middle of the Earth, the ground spins at about 1,000 miles per hour, but we don't feel it."],["space","About how many days are in one year?","It's more than 300.","Three hundred sixty-...","365","Every four years we add an extra day, February 29; that's a leap year."],["space","Where does the Moon get its light?","The Moon doesn't make its own light.","It bounces light from the S-U-N.","From the Sun","The same side of the Moon always faces Earth."],["space","What do astronauts wear to stay safe outside their spaceship?","It has a helmet and big gloves.","It's a \"space\" + \"suit.\"","A spacesuit","A NASA spacewalk suit weighs about 280 pounds on Earth, but it floats in orbit.",1],["space","This or that: which is bigger, the Sun or the Moon?","One is a giant star.","It's the one that's hot and bright in the daytime.","The Sun","The Sun is about 400 times wider than the Moon; it only looks the same size because it's much farther away.",1],["space","What do you call the big machine that blasts astronauts into space?","It goes \"3, 2, 1, blast off!\"","It rhymes with \"pocket.\"","A rocket","Rockets need to go about 17,500 miles per hour to stay in orbit around Earth.",1],["space","What do we call the Moon when it looks like a full, round circle?","It's the opposite of an empty moon.","It rhymes with \"pull\": a F___ moon.","A full moon","There's a full moon about once a month.",1],["geography","What is the biggest ocean on Earth?","It's right next to California.","It starts with y or sweet?","Don't drink it!","It's the same as on french fries: S-A-L-T-Y.","Salty","If all the ocean's salt were spread on land, it would make a layer taller than a 40-story building."],["geography","What is a really tall hill with a pointy or rocky top called?","People climb it and ski on it.","It starts with M: moun-...","A mountain","Some mountains are so tall that they have snow on top all year.",1],["geography","What do we call a big, flowing body of water that goes to the sea?","The Los Angeles one goes through the Valley.","It rhymes with \"shiver.\"","A river","The Los Angeles River starts in the San Fernando Valley, in Canoga Park."],["geography","What do we call a hot, dry, sandy place with very little rain?","Cactuses live there.","It sounds like \"dessert\" but with one S: D-E-S-E-R-T.","A desert","Some desert animals almost never drink; they get water from their food."],["geography","What is a map of the whole Earth shaped like a ball called?","You can spin it.","It rhymes with \"robe.\"","A globe","A globe is the most accurate kind of map because Earth is round too."],["math","What is 7 + 8?","It's one more than 7 + 7, which is 14.","It's one more than 14.","15","15 minutes is exactly a quarter of an hour."],["math","What is 20 − 7?","Count back from 20.","It's a baker's dozen: one more than 12.","13","A \"baker's dozen\" is 13, not 12!"],["math","How many sides does a hexagon have?","It's the shape of honeycomb cells.","\"Hex\" sounds like \"six\"!","6","Bees build hexagons because they fit together perfectly with no gaps."],["math","How many minutes are in one hour?","A clock's big hand goes all the way around once.","It's 6 tens: 10, 20, 30, 40, 50, ...","60","We count time in 60s because the ancient Babylonians counted in groups of 60."],["math","You have 2 bags with 3 apples in each. How many apples is that?","Count 3, then count 3 more.","3 + 3.","6","Apples float in water because they're about one-quarter air."],["math","What is 9 + 9 + 2?"," lue Heeler puppy)","Blue Heelers are also called Australian cattle dogs.",1],["general","In which sport do you shoot a ball through a hoop?","The Lakers play it.","\"Basket\" + \"ball.\"","Basketball","Basketball was invented in 1891 using peach baskets as hoops.",1],["general","What is it called when a batter hits the ball out of the park?","The batter gets to run all the way around the bases.","It's a H-O-M-E run.","A home run","Shohei Ohtani of the Dodgers is famous for hitting home runs and pitching.",1],["general","In soccer, which player is allowed to use their hands?","They stand in front of the net.","It rhymes with \"snowy\": goal-...","The goalie (goalkeeper)","The goalie can only use their hands inside the big box near their own goal.",1],["general","What do players hit with sticks in ice hockey?","It's flat, round, and black.","It rhymes with \"duck.\"","A puck","Hockey pucks are frozen before games so they don't bounce as much."],["general","What should you wear on your head when you ride a bike?","It keeps your head safe.","It starts with H: hel-...","A helmet","Helmets have a soft foam lining that squishes to protect your head.",1],["general","What do you use to hit the ball in tennis?","It has strings.","It rhymes with \"jacket\": R-A-C-K-E-T.","A racket","Tennis balls are fuzzy so they fly and bounce more evenly.",1],["general","What do you use to cut paper?","Be careful: they're sharp!","It starts with S: scis-...","Scissors","There are special scissors for left-handed people.",1],["general","What do you use to brush your teeth?","You put toothpaste on it.","\"Tooth\" + \"brush.\"","A toothbrush","Dentists say to brush twice a day for two minutes.",1],["general","What do you use to see in the dark?","It runs on batteries and you click it on.","\"Flash\" + \"light.\"","A flashlight","Some animals, like cats, can see much better in the dark than we can.",1],["general","What do you use to dig in the sand at the beach?","It has a handle and a scoop."," "general","What red fruit has tiny seeds on the outside?","It's often dipped in chocolate.","\"Straw\" + \"berry.\"","A strawberry","A strawberry has about 200 seeds on the outside.",1],["general","What do you pop in a pan or microwave to make popcorn?","It's yellow, from a plant.","It's in the name: pop-C-O-R-N.","Corn kernels","Popcorn pops because the water inside each kernel turns to steam.",1],["general","What yellow sauce do people put on hot dogs?","It's yellow and a little spicy.","It rhymes with \"custard.\"","Mustard","Mustard is made from the seeds of the mustard plant.",1],["general","This or that: which one is a vegetable, a carrot or an apple?","It's orange and bunnies love it.","It's not the red fruit!","A carrot","Long ago, most carrots were purple or yellow, not orange.",1],["general","What do cows give us that we drink?","It's white and goes on cereal.","It rhymes with \"silk.\"","Milk","A dairy cow can make about 6 to 8 gallons of milk a day.",1],["general","What red sauce made from tomatoes do people put on fries?","It comes in a squeeze bottle.","It starts with K: ketch-...","Ketchup","Tomatoes are fruits, so ketchup is kind of a fruit sauce!",1],["general","What frozen treat comes in a cone?","It's cold and sweet and can melt.","\"Ice\" + \"cream.\"","Ice cream","Vanilla is one of the most popular ice cream flavors in the U.S.",1],["general","This or that: which do you wear on your hands, gloves or socks?","They keep your fingers warm.","It's not the ones on your feet!","Gloves","Mittens keep hands warmer than gloves because your fingers share heat.",1],["general","This or that: which is heavier, a car or a bicycle?","One has an engine.","It's the one with four wheels.","A car","A car can weigh as much as 100 bicycles.",1],["general","This or that: which lives in water, a fish or a horse?","It has fins and gills.","It's the one that swims!","A fish","Some fish, like the mudskipper, can even hop on land.",1],["general","This or that: which is faster, an airplane or a car?","One flies in the sky.","It's the one with wings.","An airplane","A big passenger jet flies about 550 miles per hour.",1],["general","What do you wear on your feet to splash in puddles?","They're waterproof and tall.","\"Rain\" + \"boots.\"","Rain boots","In England, rain boots are often called \"wellies.\"",1],["general","What do you use an umbrella for?","You open it when it's cloudy and wet.","It keeps the R-A-I-N off you.","To stay dry in the rain (or for shade)","The word \"umbrella\" comes from a Latin word meaning \"shade.\"",1],["california","What famous sign with big white letters sits on a hill in Los Angeles?","It's the name of the movie-making neighborhood.","It's the HOLLY-W-O-O-D sign.","The Hollywood sign","It used to say \"HOLLYWOODLAND\"; the last four letters were taken off in 1949."],["california","What animal is on the California state flag?","It's big, brown, and furry.","It's a B-E-A-R (a grizzly bear).","A grizzly bear","Grizzly bears don't live wild in California anymore, but the flag honors them."],["california","What is the name of LA's baseball team in blue?","Shohei Ohtani plays for them.","It starts with D and rhymes with \"codgers.\"","The Los Angeles Dodgers","The Dodgers moved to Los Angeles from Brooklyn, New York, in 1958."],["california","What famous orange-red bridge is in San Francisco?","It's named after a shiny metal color.","The G-O-L-D-E-N Gate Bridge.","The Golden Gate Bridge","The bridge's color is officially called \"International Orange.\""],["california","What is California's nickname: the ___ State?","Think of a shiny yellow metal, like treasure.","It's G-O-L-D-E-N.","The Golden State","People rushed to California looking for gold starting in 1848."],["california","What valley do we live in, in Northridge?","It's named after a saint, San Fer-...","San Fer-nan-do.","The San Fernando Valley","People in LA often just call it \"the Valley.\""],["california","Which super-tall trees with reddish bark grow in California?","They're the tallest trees in the world.","Their name has a color in it: R-E-D-woods.","Redwoods","The tallest redwood, named Hyperion, is more than 380 feet tall!"],["california","What is the name of the pier with a Ferris wheel in Santa Monica?","It's named after the city it's in.","The Santa M-O-N-I-C-A Pier.","The Santa Monica Pier","The famous Route 66 ends near the Santa Monica Pier."],["california","What orange flower is California's state flower?","It's bright orange and grows on hillsides.","It rhymes with \"sloppy\": the California P-O-P-P-Y.","The California poppy","Poppies close their petals at night and on cloudy days."],["california","Which theme park in Anaheim is home to Mickey Mouse?","It's called the \"Happiest Place on Earth.\"","\"Disney\" + \"land.\"","Disneyland","Disneyland opened in 1955.",1],["california","What is the name of LA's purple-and-gold basketball team?","LeBron James played for them.","It starts with L and rhymes with \"bakers.\"","The Los Angeles Lakers","The team is called the \"Lakers\" because it started in Minnesota, the \"Land of 10,000 Lakes.\""],["california","What famous building on a hill in Griffith Park lets you look at stars?","It has big telescopes and domes.","It's Griffith Ob-ser-va-...","Griffith Observatory","Anyone can look through Griffith Observatory's public telescopes for free."],["california","What sticky, bubbly place in LA has Ice Age fossils?","Mammoths and saber-toothed cats got stuck there.","The La Brea T-A-R Pits.","The La Brea Tar Pits","\"La brea\" means \"the tar\" in Spanish, so the name means \"the tar tar pits\"!"],["california","What famous Hollywood sidewalk has stars with names on it?","Movie stars get their own star there.","The Hollywood Walk of F-A-M-E.","The Hollywood Walk of Fame","There are more than 2,700 stars on the Walk of Fame."],["california","What big university is right here in Northridge?","Its nickname is four letters: C-S-U-N.","Cal State North-...","Cal State Northridge (CSUN)","The CSUN sports teams are called the Matadors."],["california","What do people ride on waves at California beaches?","You stand on it and ride the waves.","\"Surf\" + \"board.\"","A surfboard","Surfing became California's official state sport in 2018.",1],["california","What is LA's hockey team called?","Their name means royalty, like a crown.","It rhymes with \"rings\": the K-I-N-G-S.","The Los Angeles Kings","The Kings have played in Los Angeles since 1967."],["california","What juicy fruit once grew in huge groves all over Orange County?","It's round and juicy and you peel it.","It's the same as the color!","Oranges","Orange County was once covered in orange groves, and its name is said to come from the fruit.",1],["california","At which theme park in LA can you visit the Wizarding World of Harry Potter?","It's a movie studio park near Hollywood.","U-ni-ver-sal Studios.","Universal Studios Hollywood","Universal Studios has been giving studio tours for more than 50 years."]],"12":[["animals","What is the fastest land animal?","It's a spotted big cat.","It lives in Africa and starts with \"Ch\".","The cheetah","A cheetah can hit about 60–70 mph, but only in short bursts of a few hundred yards."],["animals","Which continent has no native ants?","It's the coldest continent.","It's where the South Pole is.","Antarctica","There are more than 12,000 known species of ants on the other continents."],["animals","What is a group of lions called?","It's also a word for feeling proud.","P-R-...","A pride","In a pride, the female lions do most of the hunting."],["animals","Which egg-laying mammal has a bill like a duck?","It lives in Australia.","Its name starts with \"platy\".","The platypus","A platypus finds food underwater by sensing the tiny electric signals of its prey."],["animals","How many compartments does a cow's stomach have?","More than two.","It's an even number below 5.","4","Cows chew their food twice; the partly digested food they re-chew is called cud."],["animals","What is the largest living reptile?","It lives in rivers and coasts around Asia and Australia.","It's a crocodile that can swim in the sea.","The saltwater crocodile","Saltwater crocodiles can grow to around 20 feet long."],["animals","What do you call animals that eat both plants and meat?","Not herbivores or carnivores.","It starts with \"omni\", meaning \"all\".","Omnivores","Bears, raccoons, and humans are all omnivores."],["animals","Which bird has the longest migration of any animal?","It flies from the Arctic to Antarctica and back.","It's a kind of seabird called a \"tern\".","The Arctic tern","An Arctic tern can fly about 44,000 miles in a single year."],["animals","Which ocean animal sleeps with only half of its brain at a time so it can keep breathing?","It's a smart marine mammal.","\"Flipper\" was one.","The dolphin","Dolphins can keep one eye open while they sleep."],["animals","What is a baby swan called?","It starts with \"cyg\".","It rhymes with \"signet\".","A cygnet","Swans often stay with the same partner for many years."],["animals","Which animal has the biggest eyes in the animal kingdom?","It lives deep in the ocean.","It's a giant kind of squid.","The colossal squid","Its eyes can be as big as dinner plates, about 11 inches across."],["animals","What word describes animals that are active at night?","Owls and raccoons are.","It starts with \"noc\".","Nocturnal","Animals active during the day are called diurnal."],["animals","What is the largest fish in the world?","It's gentle and eats tiny plankton.","It's named after a whale, but it's a shark.","The whale shark","Whale sharks can grow more than 40 feet long, yet they mostly eat tiny plankton."],["animals","What do we call animals with a backbone?","Fish, birds, and mammals are examples.","It starts with \"V\".","Vertebrates","Fewer than 5% of all animal species have a backbone; most are invertebrates like insects."],["animals","Which is the only bird that can fly backward?","It's tiny and hovers at flowers.","Its wings hum.","The hummingbird","A hummingbird's heart can beat more than 1,200 times a minute."],["animals","What is the name of the change from tadpole to frog?","Butterflies go through it too.","It starts with \"meta\".","Metamorphosis","\"Metamorphosis\" comes from Greek words meaning \"change of shape.\""],["animals","What do koalas mostly eat?","They're leaves from one kind of tree.","The tree's oil is used in cough drops.","Eucalyptus leaves","Koalas sleep up to about 20 hours a day."],["animals","What are humans' closest living animal relatives?","They're great apes.","They're from Africa; one kind is the bonobo.","Chimpanzees and bonobos","Humans and chimpanzees share about 98–99% of their DNA."],["animals","What is the largest land animal?","It has a trunk.","It's the African kind, not the Asian kind.","The African elephant","An elephant's trunk has tens of thousands of muscle bundles and no bones."],["animals","What is a group of owls called?","It's also a word for a group of lawmakers.","It starts with \"parl\".","A parliament","Owls can't move their eyes, so they turn their heads, up to about 270 degrees."],["science","What is the chemical formula for water?","It has hydrogen and oxygen.","Two of one, one of the other.","H₂O","A single drop of water contains more than a billion trillion molecules."],["science","What is the chemical symbol for gold?","It comes from the Latin word \"aurum\".","Two letters, starting with \"A\".","Au","All the gold ever mined would fit in a cube only about 70 feet on each side."],["science","Which part of a cell holds its DNA?","It's the cell's control center.","It starts with \"N\".","The nucleus","The DNA in just one of your cells would stretch about 6 feet if uncoiled."],["science","What is the most common gas in Earth's air?","It's not oxygen!","It starts with \"N\".","Nitrogen","About 78% of the air we breathe is nitrogen."],["science","At what temperature in Celsius does water freeze?","It's a round number.","It's the lowest whole number that isn't negative.","0 °C","That's the same as 32 °F."],["science","At what temperature in Fahrenheit does water boil at sea level?","It's above 200.","It's 180 degrees above freezing (32 °F).","212 °F","On a high mountain, water boils at a lower temperature because there's less air pressure."],["science","What do you call a substance that speeds up a chemical reaction without being used up?","Cars have a \"converter\" with this name.","It starts with \"cata\".","A catalyst","Enzymes in your body are catalysts that help digest your food."],["science","Which scientist came up with the theory of relativity?","He had famously wild white hair.","E = mc².","Albert Einstein","Einstein won the Nobel Prize for explaining the photoelectric effect, not for relativity."],["science","What are the three main particles inside an atom?","One is positive, one is negative, one is neutral.","Protons, neutrons, and ...","Protons, neutrons, and electrons","An electron has only about 1/1,836 the mass of a proton."],["science","What kind of energy does a moving object have?","It starts with \"K\".","Its opposite is \"potential\" energy.","Kinetic energy","\"Kinetic\" comes from the Greek word for \"moving.\""],["science","What is the pH of pure water?","It's right in the middle of the scale.","The scale goes from 0 to 14.","7 (neutral)","Lemon juice has a pH around 2, which makes it acidic."],["science","Which layer of the atmosphere protects us from the Sun's ultraviolet rays?","It's a gas layer high up.","It's named after a gas made of three oxygen atoms.","The ozone layer","Ozone molecules are made of three oxygen atoms instead of two."],["science","Which element are diamonds and pencil \"lead\" both made of?","It's in every living thing.","Its symbol is C.","Carbon","Pencil \"lead\" is actually graphite; there's no lead in it at all."],["science","What unit measures electrical power, like on a light bulb?","It's named after a Scottish inventor.","It rhymes with \"hot\".","The watt","James Watt improved the steam engine, which helped power the Industrial Revolution."],["science","About how fast does light travel?","It's about 186,000 of something per second.","Miles per ... second!","About 186,000 miles per second (300,000 km/s)","Light could zip around the Earth about 7.5 times in one second."],["science","What type of rock forms when lava cools?","It starts with \"ig\".","It comes from the Latin word for \"fire.\"","Igneous rock","Granite and obsidian are both igneous rocks."],["science","What is it called when water vapor turns back into liquid?","It's how dew forms on grass.","It starts with \"con\".","Condensation","The \"fog\" on a cold soda can is condensation from the air."],["science","Which scientist wrote the laws of motion and described gravity?","An apple helped inspire him.","Sir Isaac ...","Isaac Newton","Newton also invented the reflecting telescope."],["science","What is the most common element in the universe?","It's the lightest element.","It's number 1 on the periodic table.","Hydrogen","About three-quarters of all normal matter in the universe is hydrogen."],["space","Which planet has the most known moons?","It has beautiful rings.","It's the sixth planet.","Saturn","Saturn has well over 200 known moons, and astronomers keep finding more."],["space","What is Saturn's largest moon?","It has a thick, hazy atmosphere.","It's named after a giant from Greek myths.","Titan","Titan has lakes and seas, but they're filled with liquid methane, not water."],["space","What does a light-year measure?","It's not time!","It's how far light goes in one year.","Distance","One light-year is about 5.9 trillion miles."],["space","What was the name of the first artificial satellite, launched in 1957?","It was launched by the Soviet Union.","It starts with \"Sput\".","Sputnik 1","Sputnik was about the size of a beach ball."],["space","Which planet has a giant storm called the Great Red Spot?","It's the biggest planet.","It starts with \"J\".","Jupiter","The Great Red Spot is wider than the whole Earth."],["space","What do we call the huge explosion of a dying star?","It's \"super\"!","Super ...","A supernova","A supernova can briefly shine brighter than an entire galaxy."],["space","Which spacecraft is the farthest human-made object from Earth?","It launched in 1977.","Its name means \"traveler,\" and it's number 1.","Voyager 1","Voyager 1 carries a golden record with sounds and music from Earth."],["space","What giant infrared space telescope launched in 2021?","It's named after a NASA leader.","James ...","The James Webb Space Telescope","Webb's main mirror is about 21 feet wide and made of 18 gold-coated segments."],["space","What is the closest star to us after the Sun?","It's in the Alpha Centauri system.","Its name starts with \"Proxima\".","Proxima Centauri","Proxima Centauri is about 4.2 light-years away."],["space","What is NASA's program to send astronauts back to the Moon called?","It's named after a Greek goddess.","She was Apollo's twin sister.","Artemis","Artemis plans to land the first woman on the Moon."],["space","About how long does sunlight take to reach Earth?","Less than 10 minutes.","It's about 8 of something.","About 8 minutes","When you look at the Sun (don't!), you're seeing it as it was 8 minutes ago."],["space","Between which two planets is the main asteroid belt?","One of them is red.","Between Mars and the biggest planet.","Mars and Jupiter","Ceres, the largest object in the asteroid belt, is a dwarf planet."],["space","What is at the center of the Milky Way galaxy?","It's super heavy and nothing escapes it.","It's a supermassive black ...","A supermassive black hole (Sagittarius A*)","It has about 4 million times the mass of the Sun."],["space","Which planet is the coldest in our solar system?","It's not the farthest planet!","It's the seventh planet and spins on its side.","Uranus","Uranus is colder than Neptune even though Neptune is farther from the Sun."],["space","Which planet has the fastest winds?","It's the farthest planet from the Sun.","It's blue and named after the Roman sea god.","Neptune","Winds on Neptune can blow more than 1,200 miles per hour."],["space","How strong is the Moon's gravity compared to Earth's?","It's a fraction.","About one-sixth.","About 1/6 as strong","A 90-pound kid would weigh only about 15 pounds on the Moon."],["space","What are comets mostly made of?","They're called \"dirty snowballs.\"","Frozen stuff mixed with dirt.","Ice, dust, and rock","A comet's tail always points away from the Sun."],["space","What two gases is the Sun mostly made of?","One is the lightest element.","Hydrogen and the gas in party balloons.","Hydrogen and helium","Helium was discovered on the Sun in 1868, before it was found on Earth!"],["space","Who was the first human to travel into space?","He was from the Soviet Union, in 1961.","His first name is Yuri.","Yuri Gagarin","His whole flight around the Earth took about 108 minutes."],["space","Who was the first American woman in space?","She flew on the space shuttle in 1983.","Her first name is Sally.","Sally Ride","Sally Ride was born in Los Angeles and grew up in Encino, right in the San Fernando Valley!"],["geography","What is the longest river in South America?","It flows through a huge rainforest.","It's named after female warriors from Greek myths.","The Amazon","The Amazon carries more water than any other river on Earth."],["geography","What is the capital of Japan?","It's a huge city.","It starts with \"T\".","Tokyo","Tokyo used to be called Edo."],["geography","What is the capital of Australia?","It's not Sydney!","It starts with \"Can\".","Canberra","Canberra was built as a compromise because Sydney and Melbourne both wanted to be the capital."],["geography","What is the smallest country in the world?","It's inside the city of Rome.","The Pope lives there.","Vatican City","Vatican City is smaller than many golf courses."],["geography","Which country has the most lakes?","It's north of the U.S.","It's famous for maple syrup.","Canada","Canada has more lakes than the rest of the world combined."],["geography","What mountain range runs down the west side of South America?","Llamas live there.","It starts with \"An\".","The Andes","The Andes are the longest mountain range on any continent."],["geography","Which African country has the most people?","It's in West Africa.","Its capital is Abuja.","Nigeria","More than 200 million people live in Nigeria."],["geography","What is the largest country by area?","It spans two continents.","Its capital is Moscow.","Russia","Russia stretches across 11 time zones."],["geography","Which U.S. state is the biggest by area?","It's not Texas!","It's very far north, next to Canada.","Alaska","Alaska is more than twice as big as Texas."],["geography","What is the deepest part of the ocean?","It's in the Pacific Ocean.","The Mariana ...","The Mariana Trench (the Challenger Deep)","It's nearly 36,000 feet deep, so Mount Everest would fit inside with room to spare."],["geography","In which country is Machu Picchu?","It's in South America.","Its capital is Lima.","Peru","Machu Picchu was built by the Inca in the 1400s, high in the Andes."],["geography","Which two countries share the longest border in the world?","One of them is the U.S.","The other one is to the north.","The United States and Canada","The border between them is about 5,500 miles long."],["geography","What is the capital of Canada?","It's not Toronto!","It starts with \"Ott\".","Ottawa","In winter, Ottawa's Rideau Canal turns into a giant skating rink people skate to work on."],["geography","Off the coast of which country is the Great Barrier Reef?","It's \"down under\".","Kangaroos live there too.","Australia","The Great Barrier Reef is the largest structure on Earth built by living things."],["geography","Which European city is built on canals, with boats called gondolas?","It's in Italy.","It starts with \"V\".","Venice","Venice is built on 118 small islands connected by bridges."],["geography","What is the capital of Egypt?","It's on the Nile River.","It starts with \"C\".","Cairo","Cairo is one of Africa's largest cities, and the Great Pyramids stand at its edge in Giza."],["geography","Which river flows through London?","It starts with \"Th\".","It sounds like \"Temz\".","The River Thames","More than 30 bridges cross the Thames in London."],["geography","What is the driest desert that isn't at the poles?","It's in South America.","It's in Chile and starts with \"A\".","The Atacama Desert","Some weather stations in the Atacama have never recorded any rain."],["geography","What is the name of the 0° longitude line that passes through Greenwich, London?","It's not the equator.","Prime ...","The Prime Meridian","At Greenwich you can stand with one foot in each hemisphere, east and west."],["geography","What is the largest lake in Africa?","It's named after a British queen.","Lake V...","Lake Victoria","Lake Victoria is considered the main source of the Nile."],["math","What is 12 × 12?","10 × 12 = 120.","Then add 2 more twelves.","144","A dozen dozens (144) is called a \"gross.\""],["math","What is 15% of 200?","10% of 200 is 20.","Add half of that for 5%.","30","A quick tip trick: find 10%, then add half of it to get 15%."],["math","What is the square root of 81?","What number times itself is 81?","It's one less than 10.","9","81 is also 3 × 3 × 3 × 3."],["math","What is 7 × 8?","It's 7 × 7 plus 7.","Think \"5, 6, 7, 8.\"","56","Memory trick: 56 = 7 × 8 (the numbers 5, 6, 7, 8 in order)."],["math","How many degrees do the three angles of a triangle add up to?","Half of a full circle.","A full circle is 360°.","180°","That's only true on a flat surface; on a sphere, a triangle's angles add up to more!"],["math","What is 25% of 80?","25% is one-fourth.","80 divided by 4.","20","Finding 25% is the same as halving twice."],["math","A car drives 60 mph for 2.5 hours. How far does it go?","60 miles every hour.","2 hours is 120 miles, plus half an hour more.","150 miles","At 60 mph, you travel exactly one mile every minute."],["math","What is the next prime number after 7?","A prime only divides by 1 and itself.","8, 9, and 10 aren't prime.","11","There are infinitely many prime numbers; the Greek mathematician Euclid proved it."],["math","What is 1/2 + 1/4?","Turn 1/2 into fourths.","2/4 + 1/4.","3/4","Three-quarters of an hour is 45 minutes."],["math","What is 3 cubed (3³)?","That's 3 × 3 × 3.","3 × 3 = 9, then × 3.","27","A Rubik's Cube is a 3 × 3 × 3 cube made of 27 little cubes (well, 26 visible ones)."],["math","What is 1,000 ÷ 8?","Half of 1,000 is 500; keep halving.","500, then 250, then ...","125","1/8 as a decimal is 0.125."],["math","How many seconds are in one hour?","60 seconds in a minute.","60 × 60.","3,600","There are 86,400 seconds in a day."],["math","What is the value of pi rounded to two decimal places?","It starts with 3.","Pi Day is on March 14 (3/14).","3.14","Pi Day, March 14, is also Albert Einstein's birthday."],["math","What is 9 × 11?","10 × 11 = 110.","Subtract one 11.","99","Any two-digit number times 11 has a trick: 11 × 23 = 2(2+3)3 = 253."],["math","What comes next: 1, 1, 2, 3, 5, 8, ...?","Add the two numbers before.","5 + 8.","13","This is the Fibonacci sequence, and its numbers show up in the spirals of sunflowers and pinecones."],["math","What is the area of a rectangle that is 6 feet by 7 feet?","Area = length × width.","6 × 7.","42 square feet","42 is also \"the answer to life, the universe, and everything\" in a famous funny sci-fi book."],["math","How many sides does a decagon have?","\"Deca\" means ...","A decade is this many years.","10","The prefix \"deca-\" means ten, as in decathlon, a contest with ten events."],["math","What is 0.5 written as a percent?","0.5 is one-half.","Half of 100%.","50%","\"Percent\" means \"out of 100.\""],["math","If you start with 1 and double it 10 times, what do you get?","2, 4, 8, 16, 32 ...","64, 128, 256, 512 ...","1,024","In computing, 1,024 bytes has traditionally been called a kilobyte."],["math","What is 18 + 27 + 15?","Add 27 and the 3 from 18 first.","18 + 27 = 45, then + 15.","60","Grouping numbers that make tens (like 5 + 5) makes mental math much faster."],["math","What number does the Roman numeral L stand for?","V is 5, X is 10.","It's half of 100 (C).","50","There's no Roman numeral for zero."],["history","Which of the Seven Wonders of the Ancient World is the only one still standing?","It's in Egypt.","It's a huge pyramid.","The Great Pyramid of Giza","It was built about 4,500 years ago."],["history","In what year did the United States declare independence?","It's in the 1700s.","\"Seventeen seventy-...\"","1776","John Adams thought Americans would celebrate on July 2, the day Congress voted for independence."],["history","Who was the first emperor of Rome?","A summer month is named after him.","His name starts with \"Aug\".","Augustus","The month of August is named after him."],["history","Which document begins with the words \"We the People\"?","It was written in 1787.","It's the U.S. ...","The U.S. Constitution","It's often called the oldest written national constitution still in use."],["history","Which ancient civilization built the pyramid at Chichén Itzá in Mexico?","They had a famous calendar.","It starts with \"M\".","The Maya","On the spring and fall equinoxes, shadows make a \"serpent\" seem to slither down the pyramid's steps."],["history","Who invented a printing press with movable type in Europe around 1440?","He was German.","His name starts with \"Guten\".","Johannes Gutenberg","The Gutenberg Bible was one of the first major books printed this way."],["history","Which mission first landed people on the Moon in 1969?","It was part of the Apollo program.","Apollo, number 11.","Apollo 11","The astronauts brought back about 47 pounds of Moo
